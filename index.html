<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agbamami Restaurant Menu</title>
<meta name="description" content="Agbamami Restaurant digital menu">

<!--
  FONT OPTIONS:
  You can change FONT_FAMILY in the SETTINGS section near the bottom.
  Available Google fonts included here:
  Poppins, Montserrat, Lato, Roboto, Nunito, Playfair Display,
  Cormorant Garamond, Merriweather, Oswald
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Oswald:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --page-bg:#fff7e8;
  --body-bg:#1f1f1f;
  --ink:#272727;
  --muted:#6f675d;
  --card:#ffffff;
  --accent:#b56b2a;
  --white:#fff;
  --overlay:rgba(0,0,0,.58);
  --font-family:'Poppins',Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font-family);
  background:var(--body-bg);
  color:var(--ink);
}
button,a{font:inherit}
a{text-decoration:none;color:inherit}

.page{
  width:min(100%,520px);
  margin:0 auto;
  min-height:100vh;
  padding:18px 14px 34px;
  background-color:var(--page-bg);
  background-image:var(--page-bg-image, none);
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.topbar{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin:2px 4px 14px;
}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  border:0;background:rgba(255,255,255,.92);
  box-shadow:0 3px 12px rgba(0,0,0,.12);
  display:grid;place-items:center;
  cursor:pointer;
}
.icon-btn svg{width:20px;height:20px}

.brand{
  text-align:center;
  padding:4px 0 16px;
}
.logo-placeholder{
  width:74px;height:74px;border-radius:50%;
  margin:0 auto 10px;
  display:grid;place-items:center;
  background:#eee0c5;
  color:#76644d;
  font-size:11px;font-weight:700;
  letter-spacing:.5px;
  overflow:hidden;
}
.logo-placeholder img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.brand h1{
  margin:0;
  font-size:22px;
  font-weight:600;
  letter-spacing:.1px;
}
.subtitle{
  margin:7px 0 0;
  color:var(--muted);
  font-size:12px;
}

.categories{display:grid;gap:12px}
.category{
  position:relative;
  height:142px;
  border-radius:17px;
  overflow:hidden;
  background:#303030;
  box-shadow:0 5px 14px rgba(0,0,0,.16);
  cursor:pointer;
  border:0;
  width:100%;
  padding:0;
  text-align:left;
}
.category::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.60),rgba(0,0,0,.05) 75%,rgba(0,0,0,.22));
}
.category .placeholder{
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:rgba(255,255,255,.5);
  font-size:12px;
  letter-spacing:1px;
  background:
    radial-gradient(circle at 25% 30%,#80654c 0 18%,transparent 19%),
    radial-gradient(circle at 72% 55%,#aa8664 0 22%,transparent 23%),
    linear-gradient(135deg,#353535,#81705d);
}
.category img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.category .label{
  position:absolute;z-index:2;left:18px;bottom:17px;
  color:#fff;font-weight:700;font-size:14px;
  letter-spacing:.2px;text-transform:uppercase;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}

.view{display:none}
.view.active{display:block}
.back{
  border:0;background:transparent;padding:4px 0 16px;
  color:var(--ink);font-weight:700;cursor:pointer;
}
.view h2{text-align:center;margin:4px 0 18px;font-size:22px}

.items{display:grid;gap:10px}
.item{
  background:var(--card);
  border-radius:14px;
  padding:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  gap:12px;
}
.item-photo{
  width:82px;
  height:82px;
  min-width:82px;
  border-radius:11px;
  overflow:hidden;
  background:
    radial-gradient(circle at 30% 30%,#b7a28b 0 18%,transparent 19%),
    linear-gradient(135deg,#ded2c0,#8e7d68);
  display:grid;
  place-items:center;
  color:rgba(255,255,255,.8);
  font-size:8px;
  font-weight:700;
  letter-spacing:.7px;
  text-align:center;
}
.item-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.item-info{flex:1;min-width:0}
.item-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item-name{font-weight:700;font-size:14px}
.item-price{font-weight:700;white-space:nowrap;color:var(--accent);font-size:14px}
.item-desc{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.45}

footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0 5px}
.small-note{
  margin:15px 2px 0;text-align:center;font-size:10px;color:#8a8177
}
@media(min-width:700px){
  .page{box-shadow:0 0 35px rgba(0,0,0,.25)}
}
</style>
</head>

<body>
<main class="page" id="page">
  <section id="home" class="view active">
    <div class="topbar">
      <a class="icon-btn" id="callBtn" aria-label="Call Agbamami" title="Call Agbamami">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.5c.9.4 1.9.6 2.9.7A2 2 0 0 1 22 16.9z"/>
        </svg>
      </a>
      <a class="icon-btn" id="locationBtn" aria-label="Open location" title="Open location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
      </a>
    </div>

    <div class="brand">
      <div class="logo-placeholder" id="logoBox">ADD LOGO</div>
      <h1>Agbamami Restaurant Menu</h1>
      <p class="subtitle">Explore our menu</p>
    </div>

    <div id="categories" class="categories"></div>
    <p class="small-note">Tap a category to view the menu.</p>
    <footer>© <span id="year"></span> Agbamami</footer>
  </section>

  <section id="categoryView" class="view">
    <button class="back" id="backBtn">← Back to menu</button>
    <h2 id="categoryTitle"></h2>
    <div id="items" class="items"></div>
  </section>
</main>

<script>
/*
==========================================================
AGBAMAMI MENU — EASY SETTINGS
==========================================================

1. CHANGE THE FONT:
   Set FONT_FAMILY to one of:
   'Poppins'
   'Montserrat'
   'Lato'
   'Roboto'
   'Nunito'
   'Playfair Display'
   'Cormorant Garamond'
   'Merriweather'
   'Oswald'

2. CHANGE THE BACKGROUND:
   Option A — solid colour:
   BACKGROUND_COLOR = "#fff7e8";
   BACKGROUND_IMAGE = "";

   Option B — your own photo:
   Put the photo inside the images folder, then:
   BACKGROUND_IMAGE = "images/background.jpg";

3. CHANGE BACKGROUND OPACITY:
   If using a photo, BACKGROUND_OVERLAY controls the colour
   placed over the photo. Example:
   "rgba(255,255,255,.20)" = light overlay
   "rgba(0,0,0,.15)" = dark overlay

4. CHANGE LOGO:
   Put your logo in /images/ and set LOGO = "images/logo.png".

5. ITEM PHOTOS:
   Every individual menu item has its own image field.
   Example:
   {
     name:"Fufu with Goat Soup",
     price:"GH₵ 120",
     desc:"Served with...",
     image:"images/items/fufu-goat-soup.jpg"
   }

   You can create folders inside /images/ such as:
   images/items/
   images/categories/
   images/background/

   Then upload your photos to GitHub and use the matching path.

==========================================================
*/

const PHONE = "+233XXXXXXXXX";
const WHATSAPP = "233XXXXXXXXX";
const LOCATION = "https://maps.google.com/?q=Agbamami";

/* ===== VISUAL SETTINGS ===== */

/* ===== BRANDING ===== */

/* ===== MENU =====

*/
const MENU = [

];

/* Apply visual settings */
document.documentElement.style.setProperty("--font-family", `'${FONT_FAMILY}', Arial, Helvetica, sans-serif`);
document.documentElement.style.setProperty("--page-bg", BACKGROUND_COLOR);
document.documentElement.style.setProperty("--body-bg", BACKGROUND_COLOR);
document.documentElement.style.setProperty("--accent", ACCENT_COLOR);
document.documentElement.style.setProperty("--ink", TEXT_COLOR);
document.documentElement.style.setProperty("--muted", MUTED_COLOR);
document.documentElement.style.setProperty("--card", CARD_COLOR);

if(BACKGROUND_IMAGE){
  document.documentElement.style.setProperty(
    "--page-bg-image",
    `linear-gradient(${BACKGROUND_OVERLAY},${BACKGROUND_OVERLAY}), url("${BACKGROUND_IMAGE}")`
  );
}

if(LOGO){
  const logoBox = document.getElementById("logoBox");
  logoBox.innerHTML = `<img src="${LOGO}" alt="Agbamami logo">`;
}

const categories = document.getElementById("categories");
const home = document.getElementById("home");
const categoryView = document.getElementById("categoryView");
const title = document.getElementById("categoryTitle");
const items = document.getElementById("items");

document.getElementById("callBtn").href = "tel:" + PHONE;
document.getElementById("locationBtn").href = LOCATION;
document.getElementById("year").textContent = new Date().getFullYear();

function renderCategories(){
  categories.innerHTML = "";
  MENU.forEach((cat, index)=>{
    const btn = document.createElement("button");
    btn.className = "category";
    btn.type = "button";

    if(cat.image){
      const img = document.createElement("img");
      img.src = cat.image;
      img.alt = cat.name;
      btn.appendChild(img);
    }else{
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "ADD CATEGORY PHOTO";
      btn.appendChild(ph);
    }

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = cat.name;
    btn.appendChild(label);

    btn.addEventListener("click", ()=>openCategory(index));
    categories.appendChild(btn);
  });
}

function openCategory(index){
  const cat = MENU[index];
  title.textContent = cat.name;
  items.innerHTML = "";

  cat.items.forEach(item=>{
    const card = document.createElement("article");
    card.className = "item";

    const photo = document.createElement("div");
    photo.className = "item-photo";

    if(item.image){
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.name;
      img.loading = "lazy";
      img.onerror = function(){
        photo.innerHTML = "PHOTO<br>NOT FOUND";
      };
      photo.appendChild(img);
    }else{
      photo.innerHTML = "ADD<br>ITEM PHOTO";
    }

    const info = document.createElement("div");
    info.className = "item-info";

    const row = document.createElement("div");
    row.className = "item-row";

    const name = document.createElement("div");
    name.className = "item-name";
    name.textContent = item.name;

    const price = document.createElement("div");
    price.className = "item-price";
    price.textContent = item.price;

    row.appendChild(name);
    row.appendChild(price);
    info.appendChild(row);

    if(item.desc){
      const desc = document.createElement("p");
      desc.className = "item-desc";
      desc.textContent = item.desc;
      info.appendChild(desc);
    }

    card.appendChild(photo);
    card.appendChild(info);
    items.appendChild(card);
  });

  home.classList.remove("active");
  categoryView.classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
  history.pushState({category:index},"","#"+slug(cat.name));
}

document.getElementById("backBtn").addEventListener("click",()=>{
  categoryView.classList.remove("active");
  home.classList.add("active");
  history.pushState({},"","#");
  window.scrollTo({top:0,behavior:"smooth"});
});

function slug(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

renderCategories();
</script>
</body>
</html>
