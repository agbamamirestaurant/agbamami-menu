<style>
:root{
  --page-bg:#fff7e8;
  --body-bg:#1f1f1f;
  --ink:#272727;
  --muted:#6f675d;
  --card:#ffffff;
  --accent:#b56b2a;
  --white:#fff;
  --overlay:rgba(0,0,0,.58);
  --font-family:'Poppins',Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  font-family:var(--font-family);
  background:var(--body-bg);
  color:var(--ink);
}
button,a{font:inherit}
a{text-decoration:none;color:inherit}

.page{
  width:100%;
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  padding:18px 14px 34px;
  overflow-x:hidden;
  background-color:var(--page-bg);
  background-image:var(--page-bg-image, none);
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.topbar{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin:2px 4px 14px;
}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  border:0;background:rgba(255,255,255,.92);
  box-shadow:0 3px 12px rgba(0,0,0,.12);
  display:grid;place-items:center;
  cursor:pointer;
}
.icon-btn svg{width:20px;height:20px}

.brand{
  text-align:center;
  padding:4px 0 16px;
}
.logo-placeholder{
  width:74px;height:74px;border-radius:50%;
  margin:0 auto 10px;
  display:grid;place-items:center;
  background:#eee0c5;
  color:#76644d;
  font-size:11px;font-weight:700;
  letter-spacing:.5px;
  overflow:hidden;
}
.logo-placeholder img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.brand h1{
  margin:0;
  font-size:22px;
  font-weight:600;
  letter-spacing:.1px;
}
.subtitle{
  margin:7px 0 0;
  color:var(--muted);
  font-size:12px;
}

.categories{display:grid;gap:12px}
.category{
  position:relative;
  height:142px;
  border-radius:17px;
  overflow:hidden;
  background:#303030;
  box-shadow:0 5px 14px rgba(0,0,0,.16);
  cursor:pointer;
  border:0;
  width:100%;
  padding:0;
  text-align:left;
}
.category::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.60),rgba(0,0,0,.05) 75%,rgba(0,0,0,.22));
}
.category .placeholder{
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:rgba(255,255,255,.5);
  font-size:12px;
  letter-spacing:1px;
  background:
    radial-gradient(circle at 25% 30%,#80654c 0 18%,transparent 19%),
    radial-gradient(circle at 72% 55%,#aa8664 0 22%,transparent 23%),
    linear-gradient(135deg,#353535,#81705d);
}
.category img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.category .label{
  position:absolute;z-index:2;left:18px;bottom:17px;
  color:#fff;font-weight:700;font-size:14px;
  letter-spacing:.2px;text-transform:uppercase;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}

.view{display:none}
.view.active{display:block}
.back{
  border:0;background:transparent;padding:4px 0 16px;
  color:var(--ink);font-weight:700;cursor:pointer;
}
.view h2{text-align:center;margin:4px 0 18px;font-size:22px}

.items{
  display:grid;
  gap:12px;
}

.items:has(.drink-item){
  gap:0;
}
.item{
  position:relative;
  width:100%;
  min-height:210px;
  border-radius:17px;
  overflow:hidden;
  background:#303030;
  box-shadow:0 5px 14px rgba(0,0,0,.16);
}
.item::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.04) 25%,rgba(0,0,0,.12) 45%,rgba(0,0,0,.78) 100%);
}
.item-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border-radius:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 25% 30%,#80654c 0 18%,transparent 19%),
    radial-gradient(circle at 72% 55%,#aa8664 0 22%,transparent 23%),
    linear-gradient(135deg,#353535,#81705d);
  display:grid;
  place-items:center;
  color:rgba(255,255,255,.65);
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  text-align:center;
}
.item-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.item-info{
  position:absolute;
  left:18px;
  right:18px;
  bottom:16px;
  z-index:2;
  min-width:0;
  color:#fff;
}
.item-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-end;
  min-width:0;
}
.item-name{
  min-width:0;
  font-weight:700;
  font-size:15px;
  line-height:1.25;
  overflow-wrap:anywhere;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.item-price{
  flex-shrink:0;
  font-weight:700;
  white-space:nowrap;
  color:#fff;
  font-size:15px;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.item-desc{
  margin:6px 0 0;
  color:rgba(255,255,255,.9);
  font-size:11px;
  line-height:1.45;
  overflow-wrap:anywhere;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.drink-item{
  display:block;
  width:100%;
  height:auto;
  min-height:0;
  margin:0;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  overflow:visible;
}

.drink-item + .drink-item{
  margin-top:0;
}

.drink-item::after{
  display:none;
}

.drink-item .item-info{
  position:static;
  left:auto;
  right:auto;
  bottom:auto;
  width:100%;
  margin:0;
  padding:0 4px;
  color:var(--ink);
}

.drink-item .item-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:0;
  padding:0;
  min-height:22px;
}

.drink-item .item-name{
  font-size:14px;
  line-height:1.2;
  color:var(--ink);
  text-shadow:none;
}

.drink-item .item-price{
  flex-shrink:0;
  font-size:14px;
  line-height:1.2;
  color:var(--accent);
  text-shadow:none;
}

.drink-item .item-desc,
.drink-item .item-photo{
  display:none;
}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0 5px}
.small-note{
  margin:15px 2px 0;text-align:center;font-size:10px;color:#8a8177
}
@media(max-width:380px){
  .page{padding-left:10px;padding-right:10px}
  .category{height:136px}
  .item{min-height:195px}
  .drink-item{min-height:0}
  .item-info{left:15px;right:15px;bottom:14px}
  .item-name,.item-price{font-size:14px}
}

@media(min-width:700px){
  .page{box-shadow:0 0 35px rgba(0,0,0,.25)}
}
</style>
</head>

if(LOGO){
  const logoBox = document.getElementById("logoBox");
  logoBox.innerHTML = `<img src="${LOGO}" alt="Agbamami logo">`;
}

const categories = document.getElementById("categories");
const home = document.getElementById("home");
const categoryView = document.getElementById("categoryView");
const title = document.getElementById("categoryTitle");
const items = document.getElementById("items");

document.getElementById("callBtn").href = "tel:" + PHONE;
document.getElementById("locationBtn").href = LOCATION;
document.getElementById("year").textContent = new Date().getFullYear();

function renderCategories(){
  categories.innerHTML = "";
  MENU.forEach((cat, index)=>{
    const btn = document.createElement("button");
    btn.className = "category";
    btn.type = "button";

    if(cat.image){
      const img = document.createElement("img");
      img.src = cat.image;
      img.alt = cat.name;
      btn.appendChild(img);
    }else{
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "ADD CATEGORY PHOTO";
      btn.appendChild(ph);
    }

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = cat.name;
    btn.appendChild(label);

    btn.addEventListener("click", ()=>openCategory(index));
    categories.appendChild(btn);
  });
}

const DRINK_CATEGORIES = new Set([
  "SOFT DRINKS",
  "FRUIT JUICE",
  "LAGER BEER & OTHER DRINKS",
  "GIN",
  "WHISKY",
  "LIQUOR",
  "BRANDY",
  "APERITIFS",
  "BITTERS",
  "MINERAL WATER",
  "OTHERS"
]);

function openCategory(index){
  const cat = MENU[index];

  title.textContent = cat.name;
  items.innerHTML = "";

  cat.items.forEach(item=>{
    const card = document.createElement("article");
    card.className = cat.isDrink ? "item drink-item" : "item";

    const photo = document.createElement("div");
    photo.className = "item-photo";

    if(item.image){
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.name;
      img.loading = "lazy";

      img.onerror = function(){
        photo.innerHTML = "PHOTO<br>NOT FOUND";
      };

      photo.appendChild(img);
    }else{
      photo.innerHTML = "ADD<br>ITEM PHOTO";
    }

    const info = document.createElement("div");
    info.className = "item-info";

    const row = document.createElement("div");
    row.className = "item-row";

    const name = document.createElement("div");
    name.className = "item-name";
    name.textContent = item.name;

    const price = document.createElement("div");
    price.className = "item-price";
    price.textContent = item.price;

    row.appendChild(name);
    row.appendChild(price);
    info.appendChild(row);

    if(item.desc){
      const desc = document.createElement("p");
      desc.className = "item-desc";
      desc.textContent = item.desc;
      info.appendChild(desc);
    }

    /* Drinks: show only name and price */
    if(cat.isDrink){
      card.appendChild(info);
    }else{
      card.appendChild(photo);
      card.appendChild(info);
    }

    items.appendChild(card);
  });

  home.classList.remove("active");
  categoryView.classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  history.pushState(
    {category:index},
    "",
    "#" + slug(cat.name)
  );
}

document.getElementById("backBtn").addEventListener("click",()=>{
  categoryView.classList.remove("active");
  home.classList.add("active");
  history.pushState({},"","#");
  window.scrollTo({top:0,behavior:"smooth"});
});

function slug(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

renderCategories();
