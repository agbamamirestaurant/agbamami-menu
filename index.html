<style>
:root{
  --page-bg:#fff7e8;
  --body-bg:#1f1f1f;
  --ink:#272727;
  --muted:#6f675d;
  --card:#ffffff;
  --accent:#b56b2a;
  --white:#fff;
  --overlay:rgba(0,0,0,.58);
  --font-family:'Poppins',Arial,Helvetica,sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  font-family:var(--font-family);
  background:var(--body-bg);
  color:var(--ink);
}
button,a{font:inherit}
a{text-decoration:none;color:inherit}

.page{
  width:100%;
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  padding:18px 14px 34px;
  overflow-x:hidden;
  background-color:var(--page-bg);
  background-image:var(--page-bg-image, none);
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

/* Drink interface background */
.page.drink-mode{
  background-image:var(--drink-bg-image);
  background-size:cover;
  background-position:top center;
  background-repeat:no-repeat;
  background-attachment:scroll;
}

/* Keep the menu wrapper content-sized so short categories do not create an extra blank page below. */
#page{height:auto;min-height:100vh;}

.topbar{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin:2px 4px 14px;
}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  border:0;background:rgba(255,255,255,.92);
  box-shadow:0 3px 12px rgba(0,0,0,.12);
  display:grid;place-items:center;
  cursor:pointer;
}
.icon-btn svg{width:20px;height:20px}

.brand{
  text-align:center;
  padding:4px 0 16px;
}
.logo-placeholder{
  width:74px;height:74px;border-radius:50%;
  margin:0 auto 10px;
  display:grid;place-items:center;
  background:#eee0c5;
  color:#76644d;
  font-size:11px;font-weight:700;
  letter-spacing:.5px;
  overflow:hidden;
}
.logo-placeholder img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.brand h1{
  margin:0;
  font-size:22px;
  font-weight:600;
  letter-spacing:.1px;
}
.subtitle{
  margin:7px 0 0;
  color:var(--muted);
  font-size:12px;
}

.categories{display:grid;gap:12px}
.category{
  position:relative;
  height:142px;
  border-radius:17px;
  overflow:hidden;
  background:#303030;
  box-shadow:0 5px 14px rgba(0,0,0,.16);
  cursor:pointer;
  border:0;
  width:100%;
  padding:0;
  text-align:left;
}
.category::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.60),rgba(0,0,0,.05) 75%,rgba(0,0,0,.22));
}
.category .placeholder{
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:rgba(255,255,255,.5);
  font-size:12px;
  letter-spacing:1px;
  background:
    radial-gradient(circle at 25% 30%,#80654c 0 18%,transparent 19%),
    radial-gradient(circle at 72% 55%,#aa8664 0 22%,transparent 23%),
    linear-gradient(135deg,#353535,#81705d);
}
.category img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.category .label{
  position:absolute;z-index:2;left:18px;bottom:17px;
  color:#fff;font-weight:700;font-size:14px;
  letter-spacing:.2px;text-transform:uppercase;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}

.view{display:none !important}
.view.active{display:block !important}
.back{
  border:0;background:transparent;padding:4px 0 16px;
  color:var(--ink);font-weight:700;cursor:pointer;
}
.view h2{text-align:center;margin:4px 0 18px;font-size:22px}

.items{
  display:grid;
  gap:12px;
}

.items:has(.drink-item){
  gap:0;
}
.item{
  position:relative;
  width:100%;
  min-height:210px;
  border-radius:17px;
  overflow:hidden;
  background:#303030;
  box-shadow:0 5px 14px rgba(0,0,0,.16);
}
.item::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.04) 25%,rgba(0,0,0,.12) 45%,rgba(0,0,0,.78) 100%);
}
.item-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border-radius:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 25% 30%,#80654c 0 18%,transparent 19%),
    radial-gradient(circle at 72% 55%,#aa8664 0 22%,transparent 23%),
    linear-gradient(135deg,#353535,#81705d);
  display:grid;
  place-items:center;
  color:rgba(255,255,255,.65);
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  text-align:center;
}
.item-photo{
  z-index:0;
}
.item-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.item-info{
  position:absolute;
  left:18px;
  right:18px;
  bottom:16px;
  z-index:2;
  min-width:0;
  color:#fff;
}
.item-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-end;
  min-width:0;
}
.item-name{
  min-width:0;
  font-weight:700;
  font-size:15px;
  line-height:1.25;
  overflow-wrap:anywhere;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.item-price{
  flex-shrink:0;
  font-weight:700;
  white-space:nowrap;
  color:#fff;
  font-size:15px;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.item-desc{
  margin:6px 0 0;
  color:rgba(255,255,255,.9);
  font-size:11px;
  line-height:1.45;
  overflow-wrap:anywhere;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.drink-item{
  display:block;
  width:100%;
  height:auto;
  min-height:0;
  margin:0;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  overflow:visible;
}

.drink-item + .drink-item{
  margin-top:0;
}

.drink-item::after{
  display:none;
}

.drink-item .item-info{
  position:static;
  left:auto;
  right:auto;
  bottom:auto;
  width:100%;
  margin:0;
  padding:0 4px;
  color:var(--ink);
}

.drink-item .item-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:0;
  padding:0;
  min-height:22px;
}

.drink-item .item-name{
  font-size:14px;
  line-height:1.2;
  color:var(--ink);
  text-shadow:none;
}

.drink-item .item-price{
  flex-shrink:0;
  font-size:14px;
  line-height:1.2;
  color:var(--accent);
  text-shadow:none;
}

.drink-item .item-desc,
.drink-item .item-photo{
  display:none;
}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0 5px}
.small-note{
  margin:15px 2px 0;text-align:center;font-size:10px;color:#8a8177
}
@media(max-width:380px){
  .page{padding-left:10px;padding-right:10px}
  .category{height:136px}
  .item{min-height:195px}
  .drink-item{min-height:0}
  .item-info{left:15px;right:15px;bottom:14px}
  .item-name,.item-price{font-size:14px}
}

@media(min-width:700px){
  .page{box-shadow:0 0 35px rgba(0,0,0,.25)}
}
/* ================================
   SMOOTH MENU PAGE TRANSITIONS
   ================================ */

#home,
#categoryView{
  will-change:transform,opacity;
}

#categoryView.menu-enter{
  animation:categoryEnter .42s cubic-bezier(.22,.61,.36,1) both;
}

#home.menu-return{
  animation:homeReturn .38s cubic-bezier(.22,.61,.36,1) both;
}

#items .item.menu-item-enter{
  animation:foodCardEnter .62s cubic-bezier(.22,.61,.36,1) both;
}

#items .drink-item.menu-item-enter{
  animation:drinkItemEnter .30s ease-out both;
}

@keyframes categoryEnter{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes homeReturn{
  from{opacity:0;transform:translateY(-12px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes foodCardEnter{
  from{opacity:0;transform:translateX(-34px);}
  to{opacity:1;transform:translateX(0);}
}

@keyframes drinkItemEnter{
  from{opacity:0;transform:translateY(5px);}
  to{opacity:1;transform:translateY(0);}
}

@media (prefers-reduced-motion:reduce){
  #categoryView.menu-enter,
  #home.menu-return,
  #items .item.menu-item-enter,
  #items .drink-item.menu-item-enter{
    animation:none;
  }
}


/* Full-image food preview */
.item-photo img{cursor:zoom-in}
.image-lightbox{
  position:fixed;inset:0;z-index:9999;
  display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(0,0,0,.90);
  opacity:0;transition:opacity .28s ease;
}
.image-lightbox.show{display:flex;opacity:1}
.image-lightbox-backdrop{position:absolute;inset:0}
.image-lightbox-content{
  position:relative;z-index:1;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.image-lightbox img{
  display:block;
  width:auto;height:auto;
  max-width:96vw;max-height:88vh;
  object-fit:contain;
  border-radius:14px;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
  transform:scale(.92);
  transition:transform .32s cubic-bezier(.22,.61,.36,1);
  cursor:zoom-out;
}
.image-lightbox.show img{transform:scale(1)}
.image-lightbox-close{
  position:absolute;top:14px;right:14px;z-index:2;
  width:44px;height:44px;border:0;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;
  font-size:30px;line-height:1;cursor:pointer;
}
.image-lightbox-caption{
  position:absolute;left:18px;right:18px;bottom:16px;z-index:2;
  text-align:center;color:#fff;font-size:14px;font-weight:700;
  text-shadow:0 2px 10px rgba(0,0,0,.75);pointer-events:none;
}
body.lightbox-open{overflow:hidden}
@media(max-width:480px){
  .image-lightbox{padding:10px}
  .image-lightbox img{max-width:98vw;max-height:84vh;border-radius:12px}
}
</style>

const APPWRITE_ENDPOINT =

const APPWRITE_DATABASE_ID =
  "agbamami_menu";

const APPWRITE_CATEGORIES_TABLE =
  "categories";

const APPWRITE_MENU_ITEMS_TABLE =
  "menu_items";


const appwriteClient =
  new Appwrite.Client();

appwriteClient
  .setEndpoint(APPWRITE_ENDPOINT)
  .setProject(APPWRITE_PROJECT_ID);


const appwriteTablesDB =
  new Appwrite.TablesDB(appwriteClient);


/* =========================================================
   GET ALL APPWRITE ROWS
========================================================= */

async function getAllAppwriteRows(tableId){

  let allRows = [];
  let offset = 0;

  while(true){

    const response =
      await appwriteTablesDB.listRows({

        databaseId:
          APPWRITE_DATABASE_ID,

        tableId:
          tableId,

        queries: [
          Appwrite.Query.limit(500),
          Appwrite.Query.offset(offset)
        ]

      });
    async function loadRestaurantSettingsFromAppwrite(){

  try{

    const rows =
      await getAllAppwriteRows(
        APPWRITE_SETTINGS_TABLE
      );

    if(!rows.length){
      return;
    }

    const settings = rows[0];

    RESTAURANT_SETTINGS = {
      restaurantName:
        settings.restaurantName ||
        "Agbamami",

      phone:
        settings.phone ||
        PHONE,

      location:
        settings.location ||
        LOCATION,

      description:
        settings.description ||
        ""
    };

  }catch(error){

    console.error(
      "Could not load restaurant settings:",
      error
    );

  }

}

    allRows =
      allRows.concat(response.rows);

    if(response.rows.length < 500){
      break;
    }

    offset += 500;

  }

  return allRows;
}


/* =========================================================
   LOAD MENU FROM APPWRITE
========================================================= */

async function loadMenuFromAppwrite(){

  try{

    const categoryRows =
      await getAllAppwriteRows(
        APPWRITE_CATEGORIES_TABLE
      );


    const itemRows =
      await getAllAppwriteRows(
        APPWRITE_MENU_ITEMS_TABLE
      );


    /*
      Convert Appwrite categories into
      the exact structure your existing
      customer menu already understands.
    */

    const visibleCategories =
      categoryRows

        .filter(category =>
          category.invisible !== true
        )

        .sort(
          (a,b) =>
            (a.sortOrder || 0) -
            (b.sortOrder || 0)
        );


    const appwriteMenu =
      visibleCategories.map(category => {

        const categoryItems =
          itemRows

            .filter(item =>
              item.categoryId === category.$id
            )

            .filter(item =>
              item.isAvailable !== false
            )

            .sort(
              (a,b) =>
                (a.sortOrder || 0) -
                (b.sortOrder || 0)
            );


        return {

          name:
            category.name || "",

          image:
            category.image || "",

          isDrink:
            category.isDrink === true,

          items:
            categoryItems.map(item => ({

              name:
                item.name || "",

              price:
                item.price || "",

              desc:
                item.description || "",

              image:
                item.image || ""

            }))

        };

      });


    /*
      Only replace the local menu if Appwrite
      actually returned usable data.
    */

    if(
      Array.isArray(appwriteMenu) &&
      appwriteMenu.length > 0
    ){

      MENU = appwriteMenu;

      renderCategories();

      /*
        If the page somehow loaded with a
        category hash, keep the normal
        home state for now.
      */

      console.log(
        "Agbamami menu loaded from Appwrite.",
        MENU
      );

    }else{

      console.warn(
        "Appwrite returned no menu. Using local menu."
      );

    }


  }catch(error){

    /*
      VERY IMPORTANT:

      If Appwrite is temporarily unavailable,
      your existing LOCAL_MENU continues
      working normally.
    */

    console.warn(
      "Could not load menu from Appwrite. " +
      "Using local menu instead.",
      error
    );

  }

}


const imageLightbox = document.getElementById("imageLightbox");
const imageLightboxImg = document.getElementById("imageLightboxImg");
const imageLightboxCaption = document.getElementById("imageLightboxCaption");
const imageLightboxClose = document.getElementById("imageLightboxClose");

function openImagePreview(src,name){
  if(!src) return;
  imageLightboxImg.src = src;
  imageLightboxImg.alt = name || "";
  imageLightboxCaption.textContent = name || "";
  imageLightbox.classList.add("show");
  imageLightbox.setAttribute("aria-hidden","false");
  document.body.classList.add("lightbox-open");
}

function closeImagePreview(){
  imageLightbox.classList.remove("show");
  imageLightbox.setAttribute("aria-hidden","true");
  document.body.classList.remove("lightbox-open");
  setTimeout(()=>{
    if(!imageLightbox.classList.contains("show")) imageLightboxImg.src = "";
  },280);
}

imageLightboxClose.addEventListener("click",closeImagePreview);
imageLightbox.addEventListener("click",event=>{
  if(event.target===imageLightbox ||
     event.target.classList.contains("image-lightbox-backdrop") ||
     event.target===imageLightboxImg){
    closeImagePreview();
  }
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape" && imageLightbox.classList.contains("show")){
    closeImagePreview();
  }
});

function renderCategories(){
  categories.innerHTML = "";
  MENU.forEach((cat, index)=>{
    const btn = document.createElement("button");
    btn.className = "category";
    btn.type = "button";

    if(cat.image){
      const img = document.createElement("img");
      img.src = cat.image;
      img.alt = cat.name;
      btn.appendChild(img);
    }else{
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "ADD CATEGORY PHOTO";
      btn.appendChild(ph);
    }

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = cat.name;
    btn.appendChild(label);

    btn.addEventListener("click", ()=>openCategory(index));
    categories.appendChild(btn);
  });
}

function instantScrollTo(y){
  const root = document.documentElement;
  const previous = root.style.scrollBehavior;
  root.style.scrollBehavior = "auto";
  window.scrollTo(0, y);
  return previous;
}

let homeScrollY = 0;

function slug(text){
  return text
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function openCategory(index){
  const cat = MENU[index];

  /* Remember exactly where the user was on the category page. */
  homeScrollY = window.scrollY;

  const root = document.documentElement;
  const previousScrollBehavior = root.style.scrollBehavior;
  root.style.scrollBehavior = "auto";

  /* Remove old animation classes before rebuilding the view. */
  home.classList.remove("menu-return");
  categoryView.classList.remove("menu-enter");

  /* Prepare the category content while the old view is still hidden. */
  if(cat.isDrink){
    document.getElementById("page").classList.add("drink-mode");
  }else{
    document.getElementById("page").classList.remove("drink-mode");
  }

  title.textContent = cat.name;
  items.innerHTML = "";

  cat.items.forEach((item, itemIndex)=>{
    const card = document.createElement("article");
    card.className = cat.isDrink
      ? "item drink-item menu-item-enter"
      : "item menu-item-enter";

    card.style.animationDelay = `${Math.min(itemIndex * 0.11, 1.65)}s`;

    const info = document.createElement("div");
    info.className = "item-info";

    const row = document.createElement("div");
    row.className = "item-row";

    const name = document.createElement("div");
    name.className = "item-name";
    name.textContent = item.name;

    const price = document.createElement("div");
    price.className = "item-price";
    price.textContent = item.price;

    row.appendChild(name);
    row.appendChild(price);
    info.appendChild(row);

    if(item.desc){
      const desc = document.createElement("p");
      desc.className = "item-desc";
      desc.textContent = item.desc;
      info.appendChild(desc);
    }

    if(cat.isDrink){
      card.appendChild(info);
    }else{
      const photo = document.createElement("div");
      photo.className = "item-photo";

      if(item.image){
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.name;
        img.addEventListener("click",(event)=>{
          event.preventDefault();
          event.stopPropagation();
          openImagePreview(img.currentSrc || img.src,item.name);
        });
        photo.addEventListener("click",(event)=>{
          if(event.target !== img){
            event.preventDefault();
            event.stopPropagation();
            openImagePreview(img.currentSrc || img.src,item.name);
          }
        });
        photo.appendChild(img);
      }else{
        photo.textContent = "ADD PHOTO";
      }

      card.appendChild(photo);
      card.appendChild(info);
    }

    items.appendChild(card);
  });

  /*
    Critical part:
    switch views and move the scroll position in the SAME JavaScript task,
    while smooth scrolling is disabled. The browser therefore paints the
    category page already at the top instead of visibly travelling there.
  */
  home.classList.remove("active");
  categoryView.classList.add("active");
  window.scrollTo(0, 0);

  /* Force the new view to register before starting its animation. */
  void categoryView.offsetWidth;
  categoryView.classList.add("menu-enter");

  history.pushState(
    {category:index},
    "",
    "#" + slug(cat.name)
  );

  /* Re-enable the user's normal smooth scrolling after the switch. */
  requestAnimationFrame(()=>{
    root.style.scrollBehavior = previousScrollBehavior;
  });
}

document.getElementById("backBtn").addEventListener("click",()=>{
  const root = document.documentElement;
  const previousScrollBehavior = root.style.scrollBehavior;

  /* Prevent a visible scroll from the category top back to the saved position. */
  root.style.scrollBehavior = "auto";

  categoryView.classList.remove("menu-enter");
  home.classList.remove("menu-return");

  /* Restore the categories view and its exact previous scroll position
     before the browser gets a chance to paint the intermediate state. */
  categoryView.classList.remove("active");
  home.classList.add("active");

  document.getElementById("page").classList.remove("drink-mode");
  history.pushState({}, "", "#");

  window.scrollTo(0, homeScrollY);

  /* Restart the beautiful home transition without moving the page. */
  void home.offsetWidth;
  home.classList.add("menu-return");

  requestAnimationFrame(()=>{
    root.style.scrollBehavior = previousScrollBehavior;
  });
});
  
loadRestaurantSettingsFromAppwrite().then(() => {
  renderCategories();
  loadMenuFromAppwrite();
});

</script>
</body>
