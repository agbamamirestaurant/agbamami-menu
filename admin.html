<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agbamami Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@28.3.0"></script>

  <style>
    <style>

  /* =========================================================
     AGbamami ADMIN — MODERN UI
  ========================================================= */

  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');

  *{
    box-sizing:border-box;
  }

  html{
    scroll-behavior:smooth;
  }

  body{
    margin:0;
    font-family:"Nunito",Arial,sans-serif;
    background:#f7f3ed;
    color:#292522;
    -webkit-font-smoothing:antialiased;
  }

  button,
  input,
  textarea,
  select{
    font:inherit;
  }

  button{
    border:0;
    border-radius:10px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:700;
    transition:
      transform .18s ease,
      box-shadow .18s ease,
      background .18s ease,
      opacity .18s ease;
  }

  button:hover{
    transform:translateY(-1px);
  }

  button:active{
    transform:translateY(0);
  }

  button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
  }

  .container{
    width:min(1100px,94%);
    margin:0 auto;
  }


  /* =========================================================
     LOGIN
  ========================================================= */

  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(
        circle at top left,
        rgba(181,107,42,.10),
        transparent 35%
      ),
      #f7f3ed;
  }

  .login-box{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,.96);
    padding:38px;
    border-radius:24px;
    border:1px solid rgba(181,107,42,.10);
    box-shadow:
      0 20px 60px rgba(60,45,30,.10);
    animation:fadeUp .55s ease both;
  }

  .login-box h1{
    margin:0 0 8px;
    text-align:center;
    font-size:30px;
    font-weight:800;
    letter-spacing:-.5px;
    color:#3a2a1f;
  }

  .login-box p{
    text-align:center;
    color:#81776d;
    margin:0 0 28px;
    font-size:15px;
  }


  /* =========================================================
     GENERAL APP
  ========================================================= */

  #adminScreen{
    display:none;
    padding-bottom:60px;
    animation:fadeIn .35s ease both;
  }

  header{
    background:rgba(255,255,255,.94);
    border-bottom:1px solid rgba(80,60,40,.09);
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }

  .header-inner{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
  }

  .brand{
    font-size:23px;
    font-weight:800;
    color:#4a321f;
    letter-spacing:-.3px;
  }

  .header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .dashboard{
    padding:30px 0;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }

  .toolbar h2{
    margin:0;
    font-size:28px;
    font-weight:800;
    letter-spacing:-.5px;
    color:#34271f;
  }


  /* =========================================================
     SECTIONS / CARDS
  ========================================================= */

  .section{
    background:#fff;
    border-radius:20px;
    padding:23px;
    margin-bottom:24px;
    border:1px solid rgba(80,60,40,.07);
    box-shadow:
      0 5px 20px rgba(70,50,30,.045);
    transition:
      box-shadow .25s ease,
      transform .25s ease;
  }

  .section:hover{
    box-shadow:
      0 9px 28px rgba(70,50,30,.07);
  }

  .section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }

  .section-title h3{
    margin:0;
    font-size:19px;
    font-weight:800;
    color:#382b22;
  }


  /* =========================================================
     FORMS
  ========================================================= */

  label{
    display:block;
    font-weight:700;
    margin-bottom:7px;
    color:#40342c;
    font-size:14px;
  }

  input,
  textarea,
  select{
    width:100%;
    border:1px solid #ddd5cc;
    border-radius:11px;
    padding:12px 13px;
    outline:none;
    background:#fff;
    color:#292522;
    transition:
      border-color .2s ease,
      box-shadow .2s ease,
      background .2s ease;
  }

  input:hover,
  textarea:hover,
  select:hover{
    border-color:#cfc3b7;
  }

  input:focus,
  textarea:focus,
  select:focus{
    border-color:#b56b2a;
    box-shadow:
      0 0 0 3px rgba(181,107,42,.11);
    background:#fffdfb;
  }

  textarea{
    min-height:90px;
    resize:vertical;
  }

  .form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
  }

  .full{
    grid-column:1/-1;
  }

  .form-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:18px;
    flex-wrap:wrap;
  }


  /* =========================================================
     BUTTONS
  ========================================================= */

  .primary{
    background:#b56b2a;
    color:#fff;
    box-shadow:
      0 4px 10px rgba(181,107,42,.16);
  }

  .primary:hover{
    background:#a45f24;
    box-shadow:
      0 6px 16px rgba(181,107,42,.22);
  }

  .secondary{
    background:#f1eeea;
    color:#3d352f;
  }

  .secondary:hover{
    background:#e7e1da;
  }

  .danger{
    background:#c62828;
    color:#fff;
  }

  .danger:hover{
    background:#b52020;
    box-shadow:
      0 5px 13px rgba(198,40,40,.18);
  }

  .success{
    background:#2e7d32;
    color:#fff;
  }

  .success:hover{
    background:#276b2b;
  }

  .warning{
    background:#e99418;
    color:#fff;
  }

  .warning:hover{
    background:#d9850e;
  }


  /* =========================================================
     CATEGORIES
  ========================================================= */

  .category-list{
    display:grid;
    gap:11px;
  }

  .category-row{
    border:1px solid #e5dfd8;
    border-radius:14px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:#fff;
    transition:
      transform .2s ease,
      box-shadow .2s ease,
      border-color .2s ease;
  }

  .category-row:hover{
    transform:translateY(-1px);
    border-color:#d9c9ba;
    box-shadow:
      0 5px 16px rgba(70,50,30,.06);
  }

  .category-info{
    min-width:0;
  }

  .category-name{
    font-weight:800;
    font-size:17px;
    color:#352a23;
  }

  .category-meta{
    color:#81776d;
    font-size:13px;
    margin-top:5px;
  }

  .category-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .hidden-category{
    opacity:.55;
  }


  /* =========================================================
     ITEMS
  ========================================================= */

  .item-list{
    display:grid;
    gap:11px;
  }

  .item-row{
    border:1px solid #e5dfd8;
    border-radius:14px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:#fff;
    transition:
      transform .2s ease,
      box-shadow .2s ease,
      border-color .2s ease;
  }

  .item-row:hover{
    transform:translateY(-1px);
    border-color:#d9c9ba;
    box-shadow:
      0 5px 16px rgba(70,50,30,.06);
  }

  .item-info{
    min-width:0;
  }

  .item-name{
    font-weight:800;
    font-size:16px;
    color:#352a23;
  }

  .item-price{
    color:#b56b2a;
    font-weight:800;
    margin-top:4px;
  }

  .item-description{
    color:#81776d;
    font-size:13px;
    margin-top:5px;
    line-height:1.45;
  }

  .item-status{
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    font-weight:800;
    padding:4px 9px;
    border-radius:20px;
  }

  .available{
    background:#e8f5e9;
    color:#2e7d32;
  }

  .unavailable{
    background:#ffebee;
    color:#c62828;
  }

  .item-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }


  /* =========================================================
     MODALS
  ========================================================= */

  .modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(35,27,21,.58);
    z-index:100;
    padding:20px;
    overflow:auto;
    animation:fadeIn .2s ease both;
  }

  .modal-content{
    width:min(650px,100%);
    background:#fff;
    border-radius:22px;
    padding:24px;
    margin:40px auto;
    box-shadow:
      0 25px 70px rgba(0,0,0,.18);
    animation:modalUp .28s ease both;
  }

  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
  }

  .modal-header h3{
    margin:0;
    font-size:21px;
    font-weight:800;
    color:#382b22;
  }

  .close{
    background:#f0ece8;
    color:#4b4038;
    border-radius:50%;
    width:38px;
    height:38px;
    padding:0;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .close:hover{
    background:#e6dfd8;
  }


  /* =========================================================
     FILE INPUTS
  ========================================================= */

  input[type="file"]{
    padding:9px;
    background:#faf8f5;
    cursor:pointer;
  }

  input[type="file"]::file-selector-button{
    border:0;
    border-radius:8px;
    padding:8px 12px;
    margin-right:10px;
    background:#eee8e1;
    color:#40362f;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    transition:background .18s ease;
  }

  input[type="file"]::file-selector-button:hover{
    background:#e3dbd2;
  }


  /* =========================================================
     MESSAGE
  ========================================================= */

  #message{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:200;
    max-width:350px;
    display:none;
    padding:14px 18px;
    border-radius:12px;
    color:#fff;
    font-weight:700;
    box-shadow:
      0 8px 25px rgba(0,0,0,.18);
    animation:messageIn .3s ease both;
  }

  #message.success-message{
    background:#2e7d32;
  }

  #message.error-message{
    background:#c62828;
  }


  /* =========================================================
     EMPTY / LOADING
  ========================================================= */

  .empty{
    color:#81776d;
    padding:18px 0;
    text-align:center;
  }

  .loading{
    color:#81776d;
    padding:14px 0;
  }


  /* =========================================================
     ANIMATIONS
  ========================================================= */

  @keyframes fadeIn{
    from{
      opacity:0;
    }

    to{
      opacity:1;
    }
  }

  @keyframes fadeUp{
    from{
      opacity:0;
      transform:translateY(12px);
    }

    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  @keyframes modalUp{
    from{
      opacity:0;
      transform:translateY(18px) scale(.985);
    }

    to{
      opacity:1;
      transform:translateY(0) scale(1);
    }
  }

  @keyframes messageIn{
    from{
      opacity:0;
      transform:translateY(10px);
    }

    to{
      opacity:1;
      transform:translateY(0);
    }
  }


  /* =========================================================
     MOBILE
  ========================================================= */

  @media(max-width:700px){

    .container{
      width:min(94%,1100px);
    }

    .dashboard{
      padding:22px 0 45px;
    }

    .toolbar{
      align-items:flex-start;
    }

    .toolbar h2{
      font-size:24px;
    }

    .section{
      padding:17px;
      border-radius:17px;
    }

    .form-grid{
      grid-template-columns:1fr;
    }

    .full{
      grid-column:auto;
    }

    .category-row,
    .item-row{
      flex-direction:column;
      align-items:flex-start;
    }

    .category-actions,
    .item-actions{
      justify-content:flex-start;
      width:100%;
    }

    .category-actions button,
    .item-actions button{
      flex:1;
    }

    .header-inner{
      padding:12px 0;
      align-items:flex-start;
      flex-direction:column;
    }

    .header-actions{
      width:100%;
    }

    .header-actions button{
      flex:1;
    }

    .modal{
      padding:12px;
    }

    .modal-content{
      margin:15px auto;
      padding:18px;
      border-radius:18px;
    }

    #message{
      left:15px;
      right:15px;
      bottom:15px;
      max-width:none;
    }
  }


  /* =========================================================
     REDUCED MOTION ACCESSIBILITY
  ========================================================= */

  @media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }

  }

</style>
   </head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen">
    <div class="login-box">
      <h1>Agbamami Admin</h1>
      <p>Sign in to manage your restaurant menu.</p>

      <form id="loginForm">
        <div style="margin-bottom:15px;">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div style="margin-bottom:15px;">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="primary" type="submit" style="width:100%;">
          Log in
        </button>
      </form>
    </div>
  </section>


  <!-- ADMIN -->
  <section id="adminScreen">

    <header>
      <div class="container header-inner">
        <div class="brand">Agbamami Admin</div>

        <div class="header-actions">
          <button class="secondary" onclick="openCustomerMenu()">
            View Menu
          </button>

          <button class="danger" onclick="logout()">
            Log out
          </button>
        </div>
      </div>
    </header>

    <main class="container dashboard">

      <div class="toolbar">
        <div>
          <h2>Menu Management</h2>
          <div style="color:#777;margin-top:4px;">
            Manage your categories and menu items.
          </div>
        </div>

        <button class="primary" onclick="openAddItemModal()">
          + Add Menu Item
        </button>
      </div>


      <!-- CATEGORIES -->
      <section class="section">

        <div class="section-title">
          <h3>Categories</h3>

          <button class="primary" onclick="openAddCategoryModal()">
            + Add Category
          </button>
        </div>

        <div id="categoryList" class="category-list">
          <div class="loading">Loading categories...</div>
        </div>

      </section>


      <!-- ITEMS -->
      <section class="section">

        <div class="section-title">
          <h3>Menu Items</h3>
        </div>

        <div id="itemList" class="item-list">
          <div class="loading">Loading menu items...</div>
        </div>

  </section>


      <!-- =========================================================
           RESTAURANT SETTINGS
      ========================================================= -->

  <section class="section">

  <div class="section-title">
    <div>
      <h3>Restaurant Settings</h3>
      <div style="color:#777;margin-top:4px;">
        Manage your restaurant information.
      </div>
    </div>
  </div>

  <div style="display:grid;gap:16px;max-width:700px;">

    <div>
      <label for="restaurantName">
        Restaurant Name
      </label>

      <input
        type="text"
        id="restaurantName"
        placeholder="Agbamami"
      >
    </div>


    <div>
      <label for="restaurantPhone">
        Phone Number
      </label>

      <input
        type="text"
        id="restaurantPhone"
        placeholder="+233..."
      >
    </div>


    <div>
      <label for="restaurantLocation">
        Location
      </label>

      <input
        type="text"
        id="restaurantLocation"
        placeholder="Google Maps link"
      >
    </div>


    <div>
      <label for="restaurantDescription">
        Restaurant Information
      </label>

      <textarea
        id="restaurantDescription"
        rows="5"
        placeholder="Tell customers about your restaurant..."
      ></textarea>
    </div>

<div>
  <label for="restaurantLogoFile">
    Restaurant Logo
  </label>

  <input
    type="file"
    id="restaurantLogoFile"
    accept="image/*"
  >

  <div
    id="logoUploadStatus"
    style="color:#777;margin-top:6px;"
  ></div>
</div>


    <button
      type="button"
      class="primary"
      onclick="saveRestaurantSettings()"
    >
      Save Restaurant Settings
    </button>


    <div
      id="settingsMessage"
      style="color:#777;"
    ></div>

    </div>

</section>

    </main>


  <!-- CATEGORY MODAL -->
  <div id="categoryModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">
        <h3 id="categoryModalTitle">Add Category</h3>
        <button class="close" onclick="closeCategoryModal()">×</button>
      </div>

      <form id="categoryForm">

        <input type="hidden" id="categoryId">

        <div class="form-grid">

          <div>
            <label for="categoryName">Category Name</label>
            <input id="categoryName" required maxlength="100">
          </div>

          <div>
            <label for="categorySortOrder">Sort Order</label>
            <input
              id="categorySortOrder"
              type="number"
              min="0"
              max="1000"
              value="0"
              required
            >
          </div>

<div class="full">
  <label for="categoryImageFile">Category Photo</label>

  <input
    type="file"
    id="categoryImageFile"
    accept="image/*"
  >

  <div
    id="categoryImageUploadStatus"
    style="color:#777;margin-top:6px;"
  ></div>
</div>

          <div class="full">
            <label for="categoryDescription">Description</label>
            <textarea id="categoryDescription"></textarea>
          </div>

          <div>
            <label>
              <input
                id="categoryIsDrink"
                type="checkbox"
                style="width:auto;margin-right:7px;"
              >
              Drink-style category
            </label>
          </div>

        </div>

        <div class="form-actions">
          <button
            type="button"
            class="secondary"
            onclick="closeCategoryModal()"
          >
            Cancel
          </button>

          <button type="submit" class="primary">
            Save Category
          </button>
        </div>

      </form>

    </div>
  </div>


  <!-- ITEM MODAL -->
  <div id="itemModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">
        <h3 id="itemModalTitle">Add Menu Item</h3>
        <button class="close" onclick="closeItemModal()">×</button>
      </div>

      <form id="itemForm">

        <input type="hidden" id="itemId">

        <div class="form-grid">

          <div class="full">
            <label for="itemName">Item Name</label>
            <input id="itemName" maxlength="150" required>
          </div>

          <div>
            <label for="itemPrice">Price</label>
            <input
              id="itemPrice"
              maxlength="50"
              placeholder="GH₵ 100"
              required
            >
          </div>

          <div>
            <label for="itemCategory">Category</label>
            <select id="itemCategory" required></select>
          </div>

        <div class="full">
        <label for="itemImageFile">Item Photo</label>

        <input
        type="file"
        id="itemImageFile"
        accept="image/*"
        >

        <div
        id="itemImageUploadStatus"
        style="color:#777;margin-top:6px;"
        ></div>
        </div>

          <div class="full">
            <label for="itemDescription">Description</label>
            <textarea id="itemDescription"></textarea>
          </div>

          <div>
            <label for="itemSortOrder">Sort Order</label>
            <input
              id="itemSortOrder"
              type="number"
              min="0"
              max="10000"
              value="0"
              required
            >
          </div>

          <div>
            <label for="itemType">Item Type</label>
            <input
              id="itemType"
              maxlength="30"
              placeholder="e.g. drink"
            >
          </div>

          <div>
            <label>
              <input
                id="itemAvailable"
                type="checkbox"
                checked
                style="width:auto;margin-right:7px;"
              >
              Available
            </label>
          </div>

          <div>
            <label>
              <input
                id="itemFeatured"
                type="checkbox"
                style="width:auto;margin-right:7px;"
              >
              Featured
            </label>
          </div>

        </div>

        <div class="form-actions">

          <button
            type="button"
            class="secondary"
            onclick="closeItemModal()"
          >
            Cancel
          </button>

          <button type="submit" class="primary">
            Save Item
          </button>

        </div>

      </form>

    </div>
  </div>


  <div id="message"></div>


<script>
/* =========================================================
   APPWRITE CONFIGURATION
========================================================= */

const APPWRITE_ENDPOINT =
  "https://fra.cloud.appwrite.io/v1";

const APPWRITE_PROJECT_ID =
  "6ad2ca49001034ba372a";

const APPWRITE_DATABASE_ID =
  "agbamami_menu";

const APPWRITE_CATEGORIES_TABLE =
  "categories";

const APPWRITE_MENU_ITEMS_TABLE =
  "menu_items";

const APPWRITE_SETTINGS_TABLE =
  "restaurant_settings";

const APPWRITE_STORAGE_BUCKET_ID =
  "agbamami_images";


/* =========================================================
   APPWRITE INITIALIZATION
========================================================= */

const appwriteClient = new Appwrite.Client();

appwriteClient
  .setEndpoint(APPWRITE_ENDPOINT)
  .setProject(APPWRITE_PROJECT_ID);

const account =
  new Appwrite.Account(appwriteClient);

const tablesDB =

/* =========================================================

========================================================= */

function showMessage(text, type = "success"){
  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    type === "error"
      ? "error-message"
      : "success-message";

  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 3500);
}


function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   GET ALL ROWS
========================================================= */

async function getAllRows(tableId){

  let allRows = [];
  let offset = 0;

  while(true){

    const response =
      await tablesDB.listRows({
        databaseId:
          APPWRITE_DATABASE_ID,

        tableId:
          tableId,

        queries: [
          Appwrite.Query.limit(500),
          Appwrite.Query.offset(offset)
        ]
      });

    allRows =
      allRows.concat(response.rows);

    if(response.rows.length < 500){
      break;
    }

    offset += 500;
  }

  return allRows;
}

async function loadData(){

  try{

    categories =
      await getAllRows(
        APPWRITE_CATEGORIES_TABLE
      );

    menuItems =
      await getAllRows(
        APPWRITE_MENU_ITEMS_TABLE
      );

    await loadRestaurantSettings();

    categories.sort(
      (a,b) =>
        (a.sortOrder || 0) -
        (b.sortOrder || 0)
    );

    menuItems.sort(
      (a,b) =>
        (a.sortOrder || 0) -
        (b.sortOrder || 0)
    );

    renderCategories();
    renderItems();
    populateCategorySelect();

  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Could not load Appwrite data.",
      "error"
    );
  }
}


/* =========================================================
   RENDER CATEGORIES
========================================================= */

function renderCategories(){

  const container =
    document.getElementById("categoryList");

  if(!categories.length){

    container.innerHTML =
      '<div class="empty">No categories found.</div>';

    return;
  }

  container.innerHTML =
    categories.map(category => {

      const categoryItemCount =
        menuItems.filter(
          item =>
            item.categoryId === category.$id
        ).length;

      const hidden =
        category.invisible === true;

      return `
        <div class="category-row ${hidden ? "hidden-category" : ""}">

          <div class="category-info">

            <div class="category-name">
              ${escapeHTML(category.name)}
            </div>

            <div class="category-meta">
              ${categoryItemCount} item(s)
              · Sort order: ${category.sortOrder || 0}
              · ${hidden ? "Hidden" : "Visible"}
            </div>

          </div>

          <div class="category-actions">

            <button
              class="secondary"
              onclick="editCategory('${category.$id}')"
            >
              Edit
            </button>

            <button
              class="${hidden ? "success" : "warning"}"
              onclick="toggleCategoryVisibility('${category.$id}')"
            >
              ${hidden ? "Show" : "Hide"}
            </button>

            <button
              class="danger"
              onclick="deleteCategory('${category.$id}')"
            >
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================================================
   RENDER ITEMS
========================================================= */

function renderItems(){

  const container =
    document.getElementById("itemList");

  if(!menuItems.length){

    container.innerHTML =
      '<div class="empty">No menu items found.</div>';

    return;
  }

  container.innerHTML =
    menuItems.map(item => {

      const category =
        categories.find(
          cat =>
            cat.$id === item.categoryId
        );

      const categoryName =
        category
          ? category.name
          : "Unknown category";

      const available =
        item.isAvailable !== false;

      return `
        <div class="item-row">

          <div class="item-info">

            <div class="item-name">
              ${escapeHTML(item.name)}
            </div>

            <div class="item-price">
              ${escapeHTML(item.price)}
            </div>

            <div class="category-meta">
              ${escapeHTML(categoryName)}
            </div>

            ${
              item.description
                ? `
                  <div class="item-description">
                    ${escapeHTML(item.description)}
                  </div>
                `
                : ""
            }

            <span class="item-status ${
              available
                ? "available"
                : "unavailable"
            }">
              ${
                available
                  ? "Available"
                  : "Unavailable"
              }
            </span>

          </div>

          <div class="item-actions">

            <button
              class="secondary"
              onclick="editItem('${item.$id}')"
            >
              Edit
            </button>

            <button
              class="${available ? "warning" : "success"}"
              onclick="toggleItemAvailability('${item.$id}')"
            >
              ${
                available
                  ? "Mark Unavailable"
                  : "Mark Available"
              }
            </button>

            <button
              class="danger"
              onclick="deleteItem('${item.$id}')"
            >
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");
}

async function toggleCategoryVisibility(id){

  try{

    await tablesDB.updateRow({

      databaseId:
        APPWRITE_DATABASE_ID,

        APPWRITE_CATEGORIES_TABLE,

      rowId:
        id,

      data:{

          category.invisible !== true
      }

    showMessage(
      category.invisible === true
        ? "Category shown."
        : "Category hidden."
    );

    await loadData();

    showMessage(
      error.message ||
      "Could not change category visibility.",
      "error"
    );
  }
}


/* =========================================================
   DELETE CATEGORY
========================================================= */

async function deleteCategory(id){

  const category =
    categories.find(
      cat => cat.$id === id
    );

  if(!category) return;

  const items =
    menuItems.filter(
      item =>
        item.categoryId === id
    );

  if(items.length){

    alert(
      `You cannot delete "${category.name}" yet because it contains ${items.length} menu item(s). Remove or move those items first.`
    );

    return;
  }

  const confirmed =
    confirm(
      `Delete the category "${category.name}"?`
    );

  if(!confirmed) return;

  try{

    await tablesDB.deleteRow({

      databaseId:
        APPWRITE_DATABASE_ID,

      tableId:
        APPWRITE_CATEGORIES_TABLE,

      rowId:
        id
    });

    showMessage(
      "Category deleted."
    );

    await loadData();

  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Could not delete category.",
      "error"
    );
  }
}
