<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agbamami Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@28.3.0"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      color:#222;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    .container{
      width:min(1100px,94%);
      margin:0 auto;
    }

    /* LOGIN */

    #loginScreen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .login-box{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:30px;
      border-radius:18px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }

    .login-box h1{
      margin:0 0 8px;
      text-align:center;
    }

    .login-box p{
      text-align:center;
      color:#777;
      margin-bottom:25px;
    }

    /* APP */

    #adminScreen{
      display:none;
      padding-bottom:50px;
    }

    header{
      background:#fff;
      border-bottom:1px solid #ddd;
      position:sticky;
      top:0;
      z-index:20;
    }

    .header-inner{
      min-height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .brand{
      font-size:22px;
      font-weight:700;
    }

    .header-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .dashboard{
      padding:25px 0;
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .toolbar h2{
      margin:0;
    }

    .section{
      background:#fff;
      border-radius:16px;
      padding:20px;
      margin-bottom:22px;
      box-shadow:0 3px 15px rgba(0,0,0,.05);
    }

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:15px;
    }

    .section-title h3{
      margin:0;
    }

    /* FORMS */

    label{
      display:block;
      font-weight:600;
      margin-bottom:6px;
    }

    input,
    textarea,
    select{
      width:100%;
      border:1px solid #ccc;
      border-radius:10px;
      padding:11px 12px;
      outline:none;
      background:#fff;
    }

    input:focus,
    textarea:focus,
    select:focus{
      border-color:#b56b2a;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:15px;
    }

    .full{
      grid-column:1/-1;
    }

    .form-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:15px;
      flex-wrap:wrap;
    }

    /* BUTTONS */

    button{
      border:0;
      border-radius:9px;
      padding:10px 15px;
      cursor:pointer;
      font-weight:600;
    }

    .primary{
      background:#b56b2a;
      color:#fff;
    }

    .secondary{
      background:#eee;
      color:#222;
    }

    .danger{
      background:#c62828;
      color:#fff;
    }

    .success{
      background:#2e7d32;
      color:#fff;
    }

    .warning{
      background:#ef9b18;
      color:#fff;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    /* CATEGORIES */

    .category-list{
      display:grid;
      gap:12px;
    }

    .category-row{
      border:1px solid #ddd;
      border-radius:12px;
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .category-info{
      min-width:0;
    }

    .category-name{
      font-weight:700;
      font-size:17px;
    }

    .category-meta{
      color:#777;
      font-size:13px;
      margin-top:4px;
    }

    .category-actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .hidden-category{
      opacity:.55;
    }

    /* ITEMS */

    .item-list{
      display:grid;
      gap:12px;
    }

    .item-row{
      border:1px solid #ddd;
      border-radius:12px;
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .item-info{
      min-width:0;
    }

    .item-name{
      font-weight:700;
      font-size:16px;
    }

    .item-price{
      color:#b56b2a;
      font-weight:700;
      margin-top:4px;
    }

    .item-description{
      color:#777;
      font-size:13px;
      margin-top:5px;
    }

    .item-status{
      display:inline-block;
      margin-top:7px;
      font-size:12px;
      font-weight:700;
      padding:4px 8px;
      border-radius:20px;
    }

    .available{
      background:#e8f5e9;
      color:#2e7d32;
    }

    .unavailable{
      background:#ffebee;
      color:#c62828;
    }

    .item-actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    /* MODAL */

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:100;
      padding:20px;
      overflow:auto;
    }

    .modal-content{
      width:min(650px,100%);
      background:#fff;
      border-radius:18px;
      padding:22px;
      margin:40px auto;
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:18px;
    }

    .modal-header h3{
      margin:0;
    }

    .close{
      background:#eee;
      border-radius:50%;
      width:38px;
      height:38px;
      padding:0;
      font-size:20px;
    }

    /* MESSAGE */

    #message{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:200;
      max-width:350px;
      display:none;
      padding:14px 18px;
      border-radius:10px;
      color:#fff;
      box-shadow:0 5px 20px rgba(0,0,0,.2);
    }

    #message.success-message{
      background:#2e7d32;
    }

    #message.error-message{
      background:#c62828;
    }

    .empty{
      color:#777;
      padding:15px 0;
    }

    .loading{
      color:#777;
      padding:10px 0;
    }

    @media(max-width:700px){
      .form-grid{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

      .category-row,
      .item-row{
        flex-direction:column;
        align-items:flex-start;
      }

      .category-actions,
      .item-actions{
        justify-content:flex-start;
        width:100%;
      }

      .header-inner{
        padding:12px 0;
        align-items:flex-start;
        flex-direction:column;
      }

      .header-actions{
        width:100%;
      }
    }
  </style>
</head>

<script>
/* =========================================================
   APPWRITE CONFIGURATION
========================================================= */

const APPWRITE_ENDPOINT =
  "https://fra.cloud.appwrite.io/v1";

const APPWRITE_PROJECT_ID =
  "6ad2ca49001034ba372a";

const APPWRITE_DATABASE_ID =
  "agbamami_menu";

const APPWRITE_CATEGORIES_TABLE =
  "categories";

const APPWRITE_MENU_ITEMS_TABLE =
  "menu_items";

const APPWRITE_SETTINGS_TABLE =
  "restaurant_settings";

const APPWRITE_STORAGE_BUCKET_ID =
  "agbamami_images";


/* =========================================================
   APPWRITE INITIALIZATION
========================================================= */

const appwriteClient = new Appwrite.Client();

appwriteClient
  .setEndpoint(APPWRITE_ENDPOINT)
  .setProject(APPWRITE_PROJECT_ID);

const account =
  new Appwrite.Account(appwriteClient);

const tablesDB =
  new Appwrite.TablesDB(appwriteClient);

const storage =
  new Appwrite.Storage(appwriteClient);

/* =========================================================
   LOCAL STATE
========================================================= */

let categories = [];
let menuItems = [];
let restaurantSettings = null;


/* =========================================================
   GENERAL HELPERS
========================================================= */

function showMessage(text, type = "success"){
  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    type === "error"
      ? "error-message"
      : "success-message";

  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 3500);
}


function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   GET ALL ROWS
========================================================= */

async function getAllRows(tableId){

  let allRows = [];
  let offset = 0;

  while(true){

    const response =
      await tablesDB.listRows({
        databaseId:
          APPWRITE_DATABASE_ID,

        tableId:
          tableId,

        queries: [
          Appwrite.Query.limit(500),
          Appwrite.Query.offset(offset)
        ]
      });

    allRows =
      allRows.concat(response.rows);

    if(response.rows.length < 500){
      break;
    }

    offset += 500;
  }

  return allRows;
}


/* =========================================================
   LOGIN
========================================================= */

async function checkExistingSession(){

  try{

    await account.get();

    showAdminScreen();

  }catch(error){

    showLoginScreen();

  }
}


async function login(email, password){

  try{

    await account.createEmailPasswordSession({
      email: email,
      password: password
    });

    showMessage("Login successful.");

    showAdminScreen();

  }catch(error){

    console.error(error);

    showMessage(
      error.message || "Login failed.",
      "error"
    );
  }
}


async function logout(){

  try{

    await account.deleteSession({
      sessionId: "current"
    });

  }catch(error){

    console.warn(error);

  }

  showLoginScreen();
}


function showLoginScreen(){

  document.getElementById("loginScreen").style.display =
    "flex";

  document.getElementById("adminScreen").style.display =
    "none";
}


async function showAdminScreen(){

  document.getElementById("loginScreen").style.display =
    "none";

  document.getElementById("adminScreen").style.display =
    "block";

  await loadData();
}

  /* =========================================================
   RESTAURANT SETTINGS
========================================================= */

async function loadRestaurantSettings(){

  try{

    const rows =
      await getAllRows(
        APPWRITE_SETTINGS_TABLE
      );

    restaurantSettings =
      rows.length ? rows[0] : null;

    document.getElementById(
      "restaurantName"
    ).value =
      restaurantSettings?.restaurantName || "";

    document.getElementById(
      "restaurantPhone"
    ).value =
      restaurantSettings?.phone || "";

    document.getElementById(
      "restaurantLocation"
    ).value =
      restaurantSettings?.location || "";

    document.getElementById(
      "restaurantDescription"
    ).value =
      restaurantSettings?.description || "";


  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Could not load restaurant settings.",
      "error"
    );
  }
}

async function uploadRestaurantLogo(){

  const fileInput =
    document.getElementById(
      "restaurantLogoFile"
    );

  const status =
    document.getElementById(
      "logoUploadStatus"
    );

  const file =
    fileInput.files[0];

  if(!file){
    return null;
  }

  try{

    status.textContent =
      "Uploading logo...";

    const response =
      await storage.createFile({

        bucketId:
          APPWRITE_STORAGE_BUCKET_ID,

        fileId:
          Appwrite.ID.unique(),

        file:
          file

      });

    const fileUrl =
      `${APPWRITE_ENDPOINT}/storage/buckets/${APPWRITE_STORAGE_BUCKET_ID}/files/${response.$id}/view?project=${APPWRITE_PROJECT_ID}`;

    status.textContent =
      "Logo uploaded successfully.";

    return fileUrl;

  }catch(error){

    console.error(error);

    status.textContent =
      error.message ||
      "Could not upload logo.";

    return null;
  }
}

async function uploadMenuItemImage(){

  const fileInput =
    document.getElementById(

        bucketId:
          APPWRITE_STORAGE_BUCKET_ID,

        fileId:
          Appwrite.ID.unique(),

        file:
          file

      });

  
    const fileUrl =
      `${APPWRITE_ENDPOINT}/storage/buckets/${APPWRITE_STORAGE_BUCKET_ID}/files/${response.$id}/view?project=${APPWRITE_PROJECT_ID}`;

    status.textContent =
      "Image uploaded successfully.";

    return fileUrl;

  }catch(error){

    console.error(error);

    status.textContent =
      error.message ||

    return null;
  }

  async function uploadCategoryImage(){

  const fileInput =
    document.getElementById(
      "categoryImageFile"
    );

  const status =

    );

    status.textContent =
      "Image uploaded successfully.";

    return fileUrl;

  }catch(error){

    console.error(error);

    status.textContent =

async function saveRestaurantSettings(){

  try{

    const uploadedLogoUrl =
      await uploadRestaurantLogo();

    const data = {

      restaurantName:
        document.getElementById(
          "restaurantName"
        ).value.trim(),

      phone:
        document.getElementById(
          "restaurantPhone"
        ).value.trim(),

      location:
        document.getElementById(
          "restaurantLocation"
        ).value.trim(),

      description:
        document.getElementById(
          "restaurantDescription"
        ).value.trim(),

      logo:
        uploadedLogoUrl ||
        restaurantSettings?.logo ||
        ""

    };

    if(restaurantSettings?.$id){

      await tablesDB.updateRow({

        databaseId:
          APPWRITE_DATABASE_ID,

        tableId:
          APPWRITE_SETTINGS_TABLE,

        rowId:
          restaurantSettings.$id,

        data:
          data
      });

      showMessage(
        "Restaurant settings updated successfully."
      );

    }else{

      const response =
        await tablesDB.createRow({

          databaseId:
            APPWRITE_DATABASE_ID,

          tableId:
            APPWRITE_SETTINGS_TABLE,

          rowId:
            Appwrite.ID.unique(),

          data:
            data
        });

      restaurantSettings =
        response;

      showMessage(
        "Restaurant settings saved successfully."
      );
    }

    await loadRestaurantSettings();

    document.getElementById(
      "restaurantLogoFile"
    ).value = "";

  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Could not save restaurant settings.",
      "error"
    );
  }
}

/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  try{

    categories =
      await getAllRows(
        APPWRITE_CATEGORIES_TABLE
      );

    menuItems =
      await getAllRows(
        APPWRITE_MENU_ITEMS_TABLE
      );

    await loadRestaurantSettings();

    categories.sort(
      (a,b) =>
        (a.sortOrder || 0) -
        (b.sortOrder || 0)
    );

    menuItems.sort(
      (a,b) =>
        (a.sortOrder || 0) -
        (b.sortOrder || 0)
    );

    renderCategories();
    renderItems();
    populateCategorySelect();

  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Could not load Appwrite data.",
      "error"
    );
  }
}


/* =========================================================
   RENDER CATEGORIES
========================================================= */

function renderCategories(){

  const container =
    document.getElementById("categoryList");

  if(!categories.length){

    container.innerHTML =
      '<div class="empty">No categories found.</div>';

    return;
  }

  container.innerHTML =
    categories.map(category => {

      const categoryItemCount =
        menuItems.filter(
          item =>
            item.categoryId === category.$id
        ).length;

      const hidden =
        category.invisible === true;

      return `
        <div class="category-row ${hidden ? "hidden-category" : ""}">

          <div class="category-info">

            <div class="category-name">
              ${escapeHTML(category.name)}
            </div>

            <div class="category-meta">
              ${categoryItemCount} item(s)
              · Sort order: ${category.sortOrder || 0}
              · ${hidden ? "Hidden" : "Visible"}
            </div>

          </div>

          <div class="category-actions">

            <button
              class="secondary"
              onclick="editCategory('${category.$id}')"
            >
              Edit
            </button>

            <button
              class="${hidden ? "success" : "warning"}"
              onclick="toggleCategoryVisibility('${category.$id}')"
            >
              ${hidden ? "Show" : "Hide"}
            </button>

            <button
              class="danger"
              onclick="deleteCategory('${category.$id}')"
            >
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================================================
   RENDER ITEMS
========================================================= */

function renderItems(){

  const container =
    document.getElementById("itemList");

  if(!menuItems.length){

    container.innerHTML =
      '<div class="empty">No menu items found.</div>';

    return;
  }

  container.innerHTML =
    menuItems.map(item => {

      const category =
        categories.find(
          cat =>
            cat.$id === item.categoryId
        );

      const categoryName =
        category
          ? category.name
          : "Unknown category";

      const available =
        item.isAvailable !== false;

      return `
        <div class="item-row">

          <div class="item-info">

            <div class="item-name">
              ${escapeHTML(item.name)}
            </div>

            <div class="item-price">
              ${escapeHTML(item.price)}
            </div>

            <div class="category-meta">
              ${escapeHTML(categoryName)}
            </div>

            ${
              item.description
                ? `
                  <div class="item-description">
                    ${escapeHTML(item.description)}
                  </div>
                `
                : ""
            }

            <span class="item-status ${
              available
                ? "available"
                : "unavailable"
            }">
              ${
                available
                  ? "Available"
                  : "Unavailable"
              }
            </span>

          </div>

          <div class="item-actions">

            <button
              class="secondary"
              onclick="editItem('${item.$id}')"
            >
              Edit
            </button>

            <button
              class="${available ? "warning" : "success"}"
              onclick="toggleItemAvailability('${item.$id}')"
            >
              ${
                available
                  ? "Mark Unavailable"
                  : "Mark Available"
              }
            </button>

            <button
              class="danger"
              onclick="deleteItem('${item.$id}')"
            >
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================================================
   CATEGORY SELECT
========================================================= */

function populateCategorySelect(){

  const select =
    document.getElementById("itemCategory");

  select.innerHTML =
    categories.map(category => {

/* =========================================================
   DELETE CATEGORY
========================================================= */

async function deleteCategory(id){

  const category =
    categories.find(
      cat => cat.$id === id
    );

  if(!category) return;

  const items =
    menuItems.filter(
      item =>
        item.categoryId === id
    );

  if(items.length){

    alert(
      `You cannot delete "${category.name}" yet because it contains ${items.length} menu item(s). Remove or move those items first.`
    );

    return;
  }

  const confirmed =
    confirm(
      `Delete the category "${category.name}"?`
    );

  if(!confirmed) return;

  try{

    await tablesDB.deleteRow({

      databaseId:
        APPWRITE_DATABASE_ID,

      tableId:
        APPWRITE_CATEGORIES_TABLE,

      rowId:
        id
    });

    showMessage(
      "Category deleted."
    );

    await loadData();

  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Could not delete category.",
      "error"
    );
  }
}
